services:
  - type: web
    name: cfam
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cfam-db
          property: connectionString

databases:
  - name: cfam-db
    databaseName: cfam
    user: cfam
